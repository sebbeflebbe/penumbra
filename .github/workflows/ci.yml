name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: "3.44.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze --fatal-warnings
      - run: flutter test --coverage
      - run: dart run tool/generate_sbom.dart build/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/sbom.cdx.json
      - name: OSV scan
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=pubspec.lock
        continue-on-error: false

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PROJECT_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - run: mkdir -p build/web/.well-known && cp web/.well-known/security.txt build/web/.well-known/security.txt && cp web/_headers build/web/_headers
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
