name: penumbra
description: A privacy-first visual thinking studio. Private by default. Visible only to you. Accessible by design.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  forui: 0.22.2
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  cryptography: ^2.7.0
  flutter_animate: ^4.5.2
  supabase_flutter: ^2.9.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  collection: ^1.19.1
  intl: ^0.20.2
  clock: ^1.1.2
  meta: ^1.16.0
  web: ^1.1.1
  crypto: ^3.0.7
  yaml: ^3.1.3
  url_launcher: ^6.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/crypto/
    - assets/prompts/
    - docs/story/
    - docs/privacy/
    - docs/accessibility/
    - docs/security/
    - docs/compliance/
    - docs/adr/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
